name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo test --locked
      - run: python3 -m venv "$RUNNER_TEMP/zigbuild" && "$RUNNER_TEMP/zigbuild/bin/pip" install cargo-zigbuild==0.24.1 && echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
