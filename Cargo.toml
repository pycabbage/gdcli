[package]
name = "gdcli"
version = "0.1.0"
edition = "2024"
description = "Read-only Google Workspace CLI for AI agents"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
google-apis-common = { version = "8", default-features = false }
google-calendar3 = { version = "7", default-features = false }
google-drive3 = { version = "7", default-features = false }
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "webpki-roots", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
url = "2"
xdg = "3"
yup-oauth2 = { version = "12", default-features = false, features = ["hyper-rustls", "ring"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["time"] }
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
